<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>水松千樹之森｜暫停開放</title>
<style>
  :root{color-scheme:light dark;--bg:#f4f1ea;--ink:#2f3a2c;--muted:#6b7566;--card:#fff;--line:#d9d4c7}
  @media (prefers-color-scheme:dark){:root{--bg:#1d241c;--ink:#e8eadf;--muted:#a3ab9c;--card:#273025;--line:#3a4637}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.8}
  main{max-width:520px;width:100%;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:36px 28px;text-align:center}
  h1{font-size:1.5rem;margin:0 0 4px}
  .en{color:var(--muted);font-size:.9rem;margin:0 0 24px}
  p{margin:.6em 0}
  .muted{color:var(--muted);font-size:.92rem}
</style>
</head>
<body>
<main>
  <h1>水松千樹之森</h1>
  <p class="en">Qianshu Forest Camp</p>
  <p>網站整備中，目前暫不對外開放，也尚未開放線上訂位。</p>
  <p class="muted">正式開放時間將另行公告，感謝您的關注與耐心等候。</p>
  <p class="muted" lang="en">The website is being prepared and is not open to the public yet. Online booking is not available at this time.</p>
</main>
</body>
</html>
