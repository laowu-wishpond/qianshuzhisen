<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>後台管理｜水松千樹之森</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-body">

<div class="admin-wrap">
  <header class="admin-header">
    <h1>水松千樹之森・後台管理</h1>
    <button id="logoutBtn" class="btn btn-outline" hidden>登出</button>
  </header>

  <section id="loginSection" class="admin-card">
    <h2>請先登入</h2>
    <form id="loginForm">
      <label for="pw">管理密碼</label>
      <input type="password" id="pw" required autocomplete="current-password">
      <button type="submit" class="btn btn-primary">登入</button>
      <p id="loginError" class="admin-error"></p>
    </form>
  </section>

  <section id="dashboardSection" class="admin-card" hidden>
    <div class="admin-filters">
      <label>日期從
        <input type="date" id="filterFrom">
      </label>
      <label>到
        <input type="date" id="filterTo">
      </label>
      <label>狀態
        <select id="filterStatus">
          <option value="">全部</option>
          <option value="pending">待確認</option>
          <option value="paid">已付款</option>
          <option value="failed">刷卡失敗</option>
          <option value="cancelled">已取消</option>
        </select>
      </label>
      <button id="refreshBtn" class="btn btn-outline" type="button">重新整理</button>
    </div>

    <div class="admin-table-wrap">
      <table class="admin-table" id="bookingsTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>姓名</th>
            <th>電話</th>
            <th>帳數</th>
            <th>人/帳</th>
            <th>金額</th>
            <th>付款方式</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="bookingsBody"></tbody>
      </table>
    </div>
    <p id="dashError" class="admin-error"></p>
  </section>

  <section id="messagesSection" class="admin-card" hidden>
    <h2>聯絡表單留言</h2>
    <div class="admin-table-wrap">
      <table class="admin-table" id="messagesTable">
        <thead>
          <tr>
            <th>時間</th>
            <th>姓名</th>
            <th>電話</th>
            <th>訊息內容</th>
            <th>狀態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="messagesBody"></tbody>
      </table>
    </div>
    <p id="messagesError" class="admin-error"></p>
  </section>
</div>

<script src="js/admin.js"></script>
</body>
</html>
